name: "Packet Filter Issues Injection"
description: "Link impairment faults: latency and jitter profiles, random and bursty loss, corruption, duplication, reordering, bandwidth limits, quotas, scheduled outages and BPF service blocking"
category: "injection"
protocols:
  - packet_filter
  - network_layer
  - link_layer
  - performance

# Packet Filter Reference (GNS3 link impairment filters)
#
# Filters are set per link through manage_gns3_packet_filter (REST: PUT
# /v3/projects/{id}/links/{link_id} with a "filters" dict). Values are
# positional lists; trailing parameters are optional. A filter whose first
# value is 0 (or empty) is disabled — EXCEPT window_drop, which is active
# whenever present (start = 0 means the outage begins immediately).
#
# BOTH link endpoints apply the filter independently: every value below is
# PER DIRECTION. delay [100] measures ~200ms RTT; packet_loss [30] measures
# ~51% round-trip loss (1 - 0.7^2).
#
# Type            Parameters                              Datapath
# delay           ms, jitter, dist (uniform|normal|       both
#                 pareto|paretonormal; needs jitter > 0)
# packet_loss     %, correl %                            both (correl kernel-only)
# corrupt         %                                      both
# duplicate  K    %, correl %                            kernel
# rate       K    "512kbit" (tc-style integer+unit,       kernel
#                 <= 100gbit; bps-family = bytes/s)
# reorder    K    %, correl %, gap 1-1000                 kernel (requires delay)
# gemodel    K    p, r, 1-h (each %) — bursty loss,       kernel (mutually exclusive
#                 mean = p/(p+r)*(1-h)                    with packet_loss)
# seed       K    u32 — reproducible netem draws          kernel (Linux >= 6.6)
# limit      K    packets (default 1000) — raise for      kernel
#                 large rate+delay (BDP sizing)
# bpf             tcpdump expression, one per line,       both
#                 any match drops
# frequency_drop  N (-1 = drop all, 0 = off)              both
# quota      K    bytes, % — after quota consumed, drop   kernel (needs ebpf)
#                 with given chance (100 = hard cut)
# window_drop K   start_ms, outage_ms, %, [period_ms,     kernel (needs ebpf)
#                 jitter_ms] — scheduled outage; ANY filter
#                 change, node restart or link reset
#                 RESTARTS the schedule
#
# K = kernel-datapath only (relay links support just five types: delay,
# packet_loss, corrupt, frequency_drop, bpf). ALWAYS call get_available
# before setting; kernel-only types on relay links return 409.
#
# Cross-filter rules (409 on violation): reorder requires delay; gemodel and
# packet_loss are mutually exclusive (one netem loss slot); window_drop
# period >= outage; delay distribution requires jitter > 0; rate must be an
# integer plus unit.
#
# Correlation collapse (netem defect): whenever chance <= correlation the
# effective rate collapses toward zero (e.g. packet_loss [10, 25] measures
# ~1.8%). For bursty loss at a chosen mean use gemodel — it is immune.
#
# BPF syntax: full tcpdump/libpcap expressions (host/net/port/proto, and/or/
# not, byte access proto[offset:size]). Semantics are match-drop — only
# matches drop; "allow only X" is written "not X". Validate complex
# expressions with `tcpdump -d` first; a line that fails to compile on the
# compute is skipped with a warning.

issues:
  # Latency Issues

  high_latency:
    name: "High Network Latency"
    description: "Inject 100ms per-direction latency (≈200ms RTT) with 10ms jitter to simulate WAN or cross-region network conditions"
    severity: "medium"
    difficulty: "beginner"
    protocols:
      - packet_filter
      - performance
    symptoms:
      - "Applications respond slowly"
      - "Voice/Video quality degradation (jitter, delay)"
      - "TCP throughput reduced due to increased RTT"
      - "Interactive sessions feel sluggish"
      - "Network tests show high round-trip times"
    troubleshooting_hints:
      - "Use ping to measure RTT: normal should be <10ms, now ~200ms (100ms delay per direction — both endpoints apply it)"
      - "Check traceroute for which hop shows increased delay"
      - "Use 'show interface' for interface statistics (if available)"
      - "Test application response times before and after"
      - "This simulates WAN/satellite/cross-region network conditions"
    applicability: "All network links requiring performance testing"
    injection_method: "packet_filter"
    filter_config:
      type: "delay"
      values: [100, 10]
    restore_commands: "Clear packet filters from affected link"

  extreme_latency:
    name: "Extreme Network Latency"
    description: "Inject 500ms per-direction latency (≈1000ms RTT) with 100ms jitter to simulate severely degraded network conditions"
    severity: "high"
    difficulty: "intermediate"
    protocols:
      - packet_filter
      - performance
    symptoms:
      - "Applications timeout or become unusable"
      - "Real-time applications (voice, video) completely fail"
      - "TCP connections may time out during establishment"
      - "File transfers extremely slow or fail"
      - "User experience is severely impacted"
    troubleshooting_hints:
      - "Use 'ping -t' to see consistent ~1000ms RTT (500ms delay applied per direction)"
      - "Check application timeout values (may need adjustment)"
      - "Monitor TCP retransmissions with 'show interface counters'"
      - "This simulates very poor network (international, congested links)"
      - "Consider TCP window scaling effects on high-latency networks"
    applicability: "Stress testing applications and network resilience"
    injection_method: "packet_filter"
    filter_config:
      type: "delay"
      values: [500, 100]
    restore_commands: "Clear packet filters from affected link"

  # Jitter Distribution (kernel-only parameter)

  wan_heavytail_jitter:
    name: "WAN Jitter (Heavy-Tailed)"
    description: "Inject 80ms delay with 20ms paretonormal-distributed jitter — calm most of the time with occasional large spikes, like measured WAN paths"
    severity: "medium"
    difficulty: "intermediate"
    protocols:
      - packet_filter
      - performance
      - wan
    symptoms:
      - "Average RTT ~160ms but occasional much larger spikes"
      - "Real-time traffic mostly fine with intermittent quality dips"
      - "Jitter buffers occasionally overrun or underrun"
      - "Ping shows clustered high-RTT outliers, not uniform variation"
      - "Timeout logic that tolerates average delay still trips on spikes"
    troubleshooting_hints:
      - "Run a long ping series and plot RTT: heavy-tail shows clustered outliers, uniform shows even spread"
      - "Distribution is a kernel-only delay parameter and requires Jitter > 0 (409 otherwise)"
      - "pareto = pure heavy tail (stress test); paretonormal = bell body + heavy tail (closest to measured WAN); normal = mild intra-DC jitter"
      - "Real-network jitter is heavy-tailed because delay variation is mostly queueing"
      - "Kernel-only parameter: verify availability with get_available before setting"
    applicability: "Realistic WAN/VoIP jitter testing on kernel-datapath links"
    injection_method: "packet_filter"
    filter_config:
      type: "delay"
      values: [80, 20, "paretonormal"]
    restore_commands: "Clear packet filters from affected link"

  # Packet Loss Issues

  packet_loss_light:
    name: "Light Packet Loss (5%)"
    description: "Inject 5% per-direction random packet loss (≈10% round-trip) to simulate unstable wireless or congested network conditions"
    severity: "medium"
    difficulty: "beginner"
    protocols:
      - packet_filter
      - performance
    symptoms:
      - "Intermittent connectivity issues"
      - "Some packets dropped, causing retransmissions"
      - "Real-time protocols show occasional glitches"
      - "Applications may retry operations automatically"
      - "Network appears mostly functional but unreliable"
    troubleshooting_hints:
      - "Use 'ping -c 100' and note packet loss percentage (~10% round-trip: 5% per direction compounds to 1 - 0.95^2)"
      - "Check for TCP retransmissions: 'show tcp statistics'"
      - "Monitor application logs for timeout/retry messages"
      - "This simulates wireless networks, weak signals, or congestion"
      - "5% loss is enough to impact TCP performance significantly"
    applicability: "Testing application resilience to packet loss"
    injection_method: "packet_filter"
    filter_config:
      type: "packet_loss"
      values: [5]
    restore_commands: "Clear packet filters from affected link"

  packet_loss_heavy:
    name: "Heavy Packet Loss (15%)"
    description: "Inject 15% per-direction random packet loss (≈28% round-trip) to simulate severely degraded network conditions"
    severity: "high"
    difficulty: "intermediate"
    protocols:
      - packet_filter
      - performance
    symptoms:
      - "Severe connectivity problems"
      - "Many applications fail or timeout"
      - "TCP throughput severely degraded"
      - "Real-time protocols unusable"
      - "High retransmission rates observed"
    troubleshooting_hints:
      - "Ping measures ~28% round-trip loss (15% per direction compounds to 1 - 0.85^2)"
      - "Packet loss >10% causes significant TCP performance issues"
      - "Check 'show interface' for error counters and drops"
      - "Monitor TCP congestion window behavior"
      - "For bursty loss instead of scattered, use gemodel (see bursty_packet_loss)"
    applicability: "Stress testing and worst-case scenario simulation"
    injection_method: "packet_filter"
    filter_config:
      type: "packet_loss"
      values: [15]
    restore_commands: "Clear packet filters from affected link"

  bursty_packet_loss:
    name: "Bursty Packet Loss (Gilbert-Elliot)"
    description: "Inject bursty ~5% mean loss — losses arrive in ~5-packet bursts ~100 packets apart — to simulate wireless fades or microburst congestion (kernel datapath only)"
    severity: "high"
    difficulty: "intermediate"
    protocols:
      - packet_filter
      - performance
      - wireless
    symptoms:
      - "Long clean runs interrupted by clustered loss bursts"
      - "TCP window stalls into full RTO timeouts instead of fast retransmit"
      - "Real-time traffic glitches in bursts rather than uniformly"
      - "Average loss ~5% but the distribution is highly non-uniform"
      - "Ping shows groups of consecutive failures"
    troubleshooting_hints:
      - "Use 'ping -c 200' and examine the pattern: clustered consecutive failures, not scattered ones"
      - "Mean one-way loss = p/(p+r)*(1-h): gemodel [1, 19, 100] = ~5% mean in bursts of ~5 packets"
      - "Prefer gemodel over correlated packet_loss for bursty loss — correlation collapses when chance <= correlation (netem defect)"
      - "Mutually exclusive with packet_loss (one netem loss slot): sending both returns 409"
      - "Kernel-only type: verify availability with get_available before setting"
    applicability: "Wireless fades, microburst congestion and burst-noise links on kernel-datapath links"
    injection_method: "packet_filter"
    filter_config:
      type: "gemodel"
      values: [1, 19, 100]
    restore_commands: "Clear packet filters from affected link"

  # Packet Corruption Issues

  packet_corruption:
    name: "Packet Corruption"
    description: "Inject 3% packet corruption to simulate transmission errors or interference"
    severity: "high"
    difficulty: "intermediate"
    protocols:
      - packet_filter
      - performance
    symptoms:
      - "Applications receive corrupted data"
      - "TCP checksum failures trigger retransmissions"
      - "Application errors due to data corruption"
      - "Some operations fail with data integrity errors"
      - "Network appears functional but data is unreliable"
    troubleshooting_hints:
      - "The damaged frame still crosses the link — the receiver's checksum does the dropping, and a capture shows the corrupted frame"
      - "Check interface CRC/error counters: 'show interface'"
      - "Monitor for TCP checksum errors"
      - "This simulates bad cables, EMI, or hardware issues"
      - "Corruption is more serious than loss (data arrives but wrong)"
    applicability: "Testing data integrity mechanisms and error handling"
    injection_method: "packet_filter"
    filter_config:
      type: "corrupt"
      values: [3]
    restore_commands: "Clear packet filters from affected link"

  # Duplication and Reordering (kernel-only)

  packet_duplication:
    name: "Packet Duplication"
    description: "Duplicate 2% of packets to simulate wireless link-layer retransmission or transient L2 loops (kernel datapath only)"
    severity: "medium"
    difficulty: "intermediate"
    protocols:
      - packet_filter
      - performance
      - wireless
    symptoms:
      - "Receivers see the same packet twice (duplicate ACKs / sequence reuse)"
      - "Non-idempotent application logic may execute twice"
      - "Captures show identical frames arriving twice"
      - "TCP mostly immune (sequence numbers dedup); UDP applications may misbehave"
      - "Under delay, the copy arrives at a different time than the original"
    troubleshooting_hints:
      - "Capture on the path and look for identical IP IDs / TCP sequence numbers"
      - "This simulates 802.11 ARQ retransmit (lost ACK) — 1-3% duplicates are normal on WiFi captures — or STP convergence loops"
      - "Use it to test protocol idempotence and dedup handling"
      - "Chance <= correlation collapses duplication the same way as loss — keep chance at or above correlation for visible duplication"
      - "Kernel-only type: verify availability with get_available before setting"
    applicability: "Protocol idempotence and dedup testing on kernel-datapath links"
    injection_method: "packet_filter"
    filter_config:
      type: "duplicate"
      values: [2]
    restore_commands: "Clear packet filters from affected link"

  packet_reordering:
    name: "Packet Reordering"
    description: "Hold back 25% of packets (5-packet gap cadence) on a 50ms path to simulate multipath (ECMP/bonding) out-of-order delivery (kernel datapath only)"
    severity: "medium"
    difficulty: "advanced"
    protocols:
      - packet_filter
      - performance
    symptoms:
      - "Packets arrive out of order at the receiver"
      - "TCP triggers duplicate ACKs, SACK and reordering heuristics (spurious retransmits)"
      - "Reorder-sensitive protocols (RTP, some UDP apps) glitch"
      - "Reordering depth is bounded by the configured delay"
      - "Ping RTT pattern irregular but the average is unchanged"
    troubleshooting_hints:
      - "Capture at both ends and compare packet order (TCP sequence numbers)"
      - "reorder requires delay (409 otherwise) — the mechanism is queue-jumping inside the netem delay queue"
      - "Watch for spurious fast retransmits: reordering mimics loss to TCP (test SACK/RACK behavior)"
      - "Aggressive reorder + rate + delay can overflow the queue — raise limit if unexplained loss appears"
      - "Kernel-only type: verify availability with get_available before setting"
    applicability: "Multipath/ECMP reordering and TCP robustness testing on kernel-datapath links"
    injection_method: "packet_filter"
    filter_config:
      type: "combined"
      values:
        delay: [50]
        reorder: [25, 25, 5]
    restore_commands: "Clear all packet filters from affected link"

  # Bandwidth and Queue Issues (kernel-only)

  bandwidth_throttling:
    name: "Bandwidth Throttling (2 Mbit/s)"
    description: "Cap the link at 2 Mbit/s per direction to simulate a slow access line or enforced bandwidth policy (kernel datapath only)"
    severity: "medium"
    difficulty: "beginner"
    protocols:
      - packet_filter
      - performance
      - qos
    symptoms:
      - "Bulk transfers max out around 2 Mbit/s regardless of link capacity"
      - "Small pings show near-normal latency; large packets serialize slowly"
      - "Speed tests report a flat ceiling instead of a variable rate"
      - "TCP throughput pinned at the cap; UDP bursts get queued"
      - "Per-packet serialization delay grows with packet size"
    troubleshooting_hints:
      - "Run iperf3 or a speed test: throughput pins at ~2 Mbit/s each direction (symmetric — the cap applies per endpoint)"
      - "Compare small-packet ping RTT (near normal) vs large-packet ping RTT (grows with size/rate)"
      - "This simulates rate-limited access lines, metered bandwidth or WAN shaping"
      - "Asymmetric rates (e.g. 20M down / 1M up) are not expressible per link — use in-guest netem on each side"
      - "Kernel-only type: verify availability with get_available before setting"
    applicability: "Bandwidth and QoS testing on kernel-datapath links"
    injection_method: "packet_filter"
    filter_config:
      type: "rate"
      values: ["2mbit"]
    restore_commands: "Clear packet filters from affected link"

  high_bdp_queue_overflow:
    name: "High BDP Path with Queue Overflow"
    description: "Combine 10 Mbit/s rate with 2000ms delay so the default 1000-packet impairment queue overflows — throughput falls below the configured rate and the link loses packets no filter asked to lose (kernel datapath only)"
    severity: "high"
    difficulty: "advanced"
    protocols:
      - packet_filter
      - performance
    symptoms:
      - "Measured throughput well below the configured 10 Mbit/s"
      - "Packet loss on a link whose filters only ask for delay and rate"
      - "TCP sees timeouts and retransmissions with no configured loss"
      - "Long transfers stall or collapse after the initial burst"
      - "Loss scales with offered load rather than being random per-packet"
    troubleshooting_hints:
      - "The netem queue holds 1000 packets by default; 10 Mbit/s x 2 s = ~2.5 MB = ~1700 full-size packets (the BDP) — past the default the queue tail-drops"
      - "Fix: raise the limit filter (e.g. limit [5000]) — rule of thumb limit = rate x delay / average packet size, plus headroom"
      - "Distinguish from configured loss: queue-overflow loss appears only when traffic fills the pipe, random loss hits every packet rate"
      - "delay is per direction: 2000ms here means ~4s RTT"
      - "Kernel-only types (rate, limit): verify availability with get_available before setting"
    applicability: "Satellite and long-fat-network (LFN) path simulation on kernel-datapath links"
    injection_method: "packet_filter"
    filter_config:
      type: "combined"
      values:
        rate: ["10mbit"]
        delay: [2000]
    restore_commands: "Clear all packet filters from affected link"

  # Deterministic Drops

  intermittent_connectivity:
    name: "Intermittent Connectivity"
    description: "Drop every 10th packet to simulate periodic link flapping or unstable connections"
    severity: "medium"
    difficulty: "beginner"
    protocols:
      - packet_filter
      - performance
    symptoms:
      - "Network appears up but some operations fail randomly"
      - "Periodic timeouts or connection drops"
      - "Applications show inconsistent behavior"
      - "Some pings succeed, others fail"
      - "User experience is unpredictable"
    troubleshooting_hints:
      - "Use continuous ping: 'ping -t' to see the pattern"
      - "Look for periodic failures (every 10th packet; on the kernel datapath counting is per direction, so round-trip measures ~19%)"
      - "This simulates loose cables, intermittent hardware, or interference"
      - "More challenging to diagnose than complete failures"
      - "Check physical layer (cables, connectors) for intermittent issues"
    applicability: "Testing fault detection and diagnostic skills"
    injection_method: "packet_filter"
    filter_config:
      type: "frequency_drop"
      values: [10]
    restore_commands: "Clear packet filters from affected link"

  complete_link_failure:
    name: "Complete Link Failure"
    description: "Drop all packets to simulate complete network outage or cable disconnection"
    severity: "critical"
    difficulty: "beginner"
    protocols:
      - packet_filter
      - performance
    symptoms:
      - "No connectivity across the link"
      - "All pings fail with 100% packet loss"
      - "Routing protocols lose adjacency"
      - "Applications show 'network unreachable'"
      - "Interface may show 'up' but no traffic passes"
    troubleshooting_hints:
      - "This simulates cable unplugged, device powered off, or link down"
      - "Check physical layer: cables, SFP modules, power"
      - "Verify interface status on both ends"
      - "Look for interface errors in logs"
      - "Use 'show ip route' to see routing impact"
    applicability: "Testing outage recovery and redundancy mechanisms"
    injection_method: "packet_filter"
    filter_config:
      type: "frequency_drop"
      values: [-1]
    restore_commands: "Clear packet filters from affected link"

  # Scheduled Outages and Quotas (kernel-only, need uBridge ebpf support)

  scheduled_outage:
    name: "Scheduled One-Shot Outage"
    description: "Link passes normally, dies completely for 3 seconds starting 5 seconds after apply, then recovers by itself — a maintenance-window outage (kernel datapath only)"
    severity: "high"
    difficulty: "intermediate"
    protocols:
      - packet_filter
      - performance
    symptoms:
      - "Traffic passes normally before the window opens"
      - "Total loss (100% drop) inside [start, start+outage) — pings time out in a solid block"
      - "Link recovers by itself with no configuration change"
      - "Routing adjacencies drop and re-establish after the window"
      - "Re-applying the same filters re-arms the outage"
    troubleshooting_hints:
      - "window_drop [5000, 3000, 100]: start is relative to the moment of apply — any filter change, node restart or link reset RESTARTS the schedule"
      - "Arm the filter immediately before generating traffic, or use the period parameter for a repeatable event"
      - "Both endpoints run their own schedule: a round trip survives only when both directions are outside their windows"
      - "start = 0 is valid and active (outage begins immediately) — unlike other filters a zero first parameter does not mean disabled"
      - "Kernel-only type needing uBridge ebpf support: verify availability with get_available before setting"
    applicability: "Maintenance-window and failover-triggering outages on kernel-datapath links"
    injection_method: "packet_filter"
    filter_config:
      type: "window_drop"
      values: [5000, 3000, 100]
    restore_commands: "Clear packet filters from affected link"

  recurring_link_flap:
    name: "Recurring Link Flap"
    description: "Dead 2 seconds out of every 10 (20% duty cycle) to stress convergence, failover and dampening logic (kernel datapath only)"
    severity: "high"
    difficulty: "advanced"
    protocols:
      - packet_filter
      - performance
      - ha
    symptoms:
      - "Periodic ~2 second outages every ~10 seconds"
      - "Routing protocols flap neighbors and re-converge repeatedly"
      - "FHRP (HSRP/VRRP/GLBP) state churns with repeated failovers"
      - "Logs show periodic session loss without a physical link-down event"
      - "TCP sessions repeatedly stall and recover"
    troubleshooting_hints:
      - "window_drop [0, 2000, 100, 10000]: the recurring form — duty cycle = outage/period (period >= outage is validated)"
      - "The optional 5th parameter (jitter) randomizes each cycle so protocol timers do not phase-lock with the outage"
      - "Lower chance (e.g. 40) degrades the window instead of a full outage"
      - "Measure convergence time with timestamped pings; tune BFD/hold timers against the flap rate"
      - "Kernel-only type needing uBridge ebpf support: verify availability with get_available before setting"
    applicability: "Link-flap convergence, FHRP failover and dampening tests on kernel-datapath links"
    injection_method: "packet_filter"
    filter_config:
      type: "window_drop"
      values: [0, 2000, 100, 10000]
    restore_commands: "Clear packet filters from affected link"

  quota_exhaustion:
    name: "Traffic Quota Exhaustion"
    description: "Pass the first 50 MB normally, then hard-cut all traffic — a metered quota or billing cutoff mid-stream (kernel datapath only)"
    severity: "high"
    difficulty: "intermediate"
    protocols:
      - packet_filter
      - performance
    symptoms:
      - "Traffic flows normally until ~50 MB has crossed the link, then stops completely"
      - "Connections die mid-transfer with no configuration change"
      - "New flows are also blocked (the quota is already consumed)"
      - "Pings fail only after the quota is used up"
      - "Re-applying filters resets the counters and restores service until the quota refills"
    troubleshooting_hints:
      - "quota [50000000, 100]: bytes counted per direction from the moment of apply; chance 100 = hard cutoff, lower = degraded service after the quota"
      - "Any filter change resets the counters (reconcile = reset + re-apply)"
      - "Drops happen in the eBPF classifier stage: captures and markers on the link do NOT observe them"
      - "Diagnose by correlating cumulative transferred bytes with the failure onset"
      - "Kernel-only type needing uBridge ebpf support: verify availability with get_available before setting"
    applicability: "Quota/billing cutoffs and mid-stream application resilience on kernel-datapath links"
    injection_method: "packet_filter"
    filter_config:
      type: "quota"
      values: [50000000, 100]
    restore_commands: "Clear packet filters from affected link"

  # Reproducibility (kernel-only)

  reproducible_loss_pattern:
    name: "Reproducible Loss Pattern (Seeded)"
    description: "10% per-direction loss with a fixed PRNG seed so every run draws the identical loss sequence — identical symptoms for every student or repetition (kernel datapath only)"
    severity: "medium"
    difficulty: "beginner"
    protocols:
      - packet_filter
      - performance
    symptoms:
      - "Same ping success/failure sequence observed on every re-run with the same traffic"
      - "A/B comparisons of mitigation strategies under identical impairments"
      - "Otherwise behaves exactly like 10% random loss (~19% round-trip)"
    troubleshooting_hints:
      - "seed pins the netem draws only (loss, duplicate, corrupt, jitter) — the eBPF draws (quota, window_drop) are NOT pinned"
      - "Reproduction requires Linux >= 6.6: older kernels silently ignore the seed while every other knob applies"
      - "Reproduction also requires the same traffic pattern — draws are consumed per arriving packet"
      - "One seed pins one realization, not the distribution — run several seeds for statistical conclusions"
      - "Combine with any netem fault (delay/packet_loss/corrupt/duplicate) for repeatable classroom labs"
    applicability: "Repeatable training labs and controlled A/B experiments on kernel-datapath links"
    injection_method: "packet_filter"
    filter_config:
      type: "combined"
      values:
        packet_loss: [10]
        seed: [42]
    restore_commands: "Clear all packet filters from affected link"

  # Combined Scenarios

  degraded_network:
    name: "Degraded Network (Mild)"
    description: "Combined 100ms delay, 10ms jitter, and 5% packet loss per direction for realistic poor network conditions"
    severity: "medium"
    difficulty: "intermediate"
    protocols:
      - packet_filter
      - performance
    symptoms:
      - "Noticeably slow application response"
      - "Some operations timeout or retry"
      - "Voice/video quality degraded but usable"
      - "File transfers slow but complete"
      - "User experience is poor but functional"
    troubleshooting_hints:
      - "All values are per direction: ~200ms RTT and ~10% round-trip loss"
      - "This simulates congested WAN or long-distance links"
      - "Check multiple metrics: latency, loss, jitter"
      - "Applications may need timeout adjustments"
      - "Consider QoS mechanisms to prioritize critical traffic"
    applicability: "Real-world performance testing and application tuning"
    injection_method: "packet_filter"
    filter_config:
      type: "combined"
      values:
        delay: [100, 10]
        packet_loss: [5]
    restore_commands: "Clear all packet filters from affected link"

