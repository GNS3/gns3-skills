# Topic file: merged into the frr_vtysh device skill under topics.ospf
# at load time. "device_type" must match the _base.yaml of this directory.

device_type: "frr_vtysh"
topic: ospf
name: "OSPFv2 / OSPFv3 (FRR 10.x)"
description: "OSPF without instance mode, interface-level ospf6 area binding and the ospf6 router-id syntax trap"

config_commands:
  ospfv2:
    syntax: "router ospf
 router-id <rid>
 network <prefix>/<len> area 0"
    example: "router ospf
 router-id 10.5.2.2
 network 10.5.0.0/16 area 0"
    description: "OSPFv2 process. FRR 10.x has NO instance/pid mode — 'router ospf' with no pid, else 'instance not running'; use network statements to cover loopback + links; add 'default-information originate always' on borders to inject a default"

  ospfv3:
    syntax: "interface eth<N>
 ipv6 ospf6 area 0.0.0.0
router ospf6
 ospf6 router-id <rid>"
    description: "OSPFv3/ospf6d: area binding is INTERFACE-LEVEL 'ipv6 ospf6 area 0.0.0.0' (FRR 10.3 removed 'interface X area' under router ospf6). Inside 'router ospf6' the command is 'ospf6 router-id' — a bare 'router-id' is silently ignored and the block stays empty"

display_commands:
  show_ospf_neighbor:
    syntax: "show ip ospf neighbor"
    description: "OSPFv2 adjacencies (expect Full for every mesh peer)"

  show_ospf6_neighbor:
    syntax: "show ipv6 ospf6 neighbor"
    description: "OSPFv3 adjacencies"

  show_ip_route:
    syntax: "show ip route ospf"
    description: "OSPF-learned v4 routes (loopbacks /32, links, OE2 default on internal nodes)"

  show_ipv6_route:
    syntax: "show ipv6 route ospf6"
    description: "OSPFv3-learned v6 routes (via fe80:: link-local nexthops)"

notes:
  - "OSPF transit links: set 'ip ospf network point-to-point' (and 'ipv6 ospf6 network point-to-point') on mesh links to skip DR election"
  - "FRR 10.x has no OSPF instance mode: 'router ospf 1' / 'ip ospf 1 area 0' fail with 'instance not running'"

troubleshooting:
  ospf_instance_not_running:
    - "Error '% ... instance that is not running' or '% OSPF is not running in instance mode'"
    - "Cause: used 'router ospf 1' or 'ip ospf 1 area 0' (FRR 10.x)"
    - "Fix: 'router ospf' without pid + 'network' statements; interface-level 'ip ospf area 0'"

  ospf6_block_empty:
    - "Symptom: 'router ospf6' config stays empty, no router-id set"
    - "Cause: used 'router-id' inside router ospf6 (silently ignored)"
    - "Fix: 'ospf6 router-id <rid>'"
