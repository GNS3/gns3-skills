name: "FRR (Free Range Routing)"
description: "FRRouting FRR 10.x on GNS3 docker nodes — vtysh configuration for dual-stack OSPFv2/OSPFv6, BGP (incl. route-server clients), static routes and write memory persistence"
device_type: "frr_vtysh"
category: "device"

# Configuration Commands (vtysh; console lands directly in vtysh, prompt '<hostname>#')
config_commands:
  configure_terminal:
    syntax: "configure terminal"
    description: "Enter config mode (not needed when typing interactively in vtysh at the # prompt; REQUIRED first line for scripted multi-line config pushes)"

  interface_address:
    syntax: "interface eth<N>
 ip address <ip>/<len>
 ipv6 address <ipv6>/<len>"
    example: "interface eth1
 ip address 10.5.23.2/24
 ipv6 address 2026:5:23::2/64"
    description: "Set dual-stack addresses (GNS3 docker adapter N = eth<N>). Interface IPs live in vtysh and are written to /etc/frr/frr.conf by write memory"
    parameters:
      N: "GNS3 adapter number (adapter 1 = eth1)"
      ip: "IPv4 prefix in CIDR notation"

  ospfv2:
    syntax: "router ospf
 router-id <rid>
 network <prefix>/<len> area 0"
    example: "router ospf
 router-id 10.5.2.2
 network 10.5.0.0/16 area 0"
    description: "OSPFv2 process. FRR 10.x has NO instance/pid mode — 'router ospf' with no pid, else 'instance not running'; use network statements to cover loopback + links; add 'default-information originate always' on borders to inject a default"

  ospfv3:
    syntax: "interface eth<N>
 ipv6 ospf6 area 0.0.0.0
router ospf6
 ospf6 router-id <rid>"
    description: "OSPFv3/ospf6d: area binding is INTERFACE-LEVEL 'ipv6 ospf6 area 0.0.0.0' (FRR 10.3 removed 'interface X area' under router ospf6). Inside 'router ospf6' the command is 'ospf6 router-id' — a bare 'router-id' is silently ignored and the block stays empty"

  static_routes:
    syntax: "ip route <prefix>/<len> Null0
ipv6 route <prefix>/<len> Null0
ip route 0.0.0.0/0 <nexthop>"
    description: "Static routes; Null0 anchors aggregate prefixes before originating them into BGP with 'network'"

  bgp_base:
    syntax: "router bgp <asn>
 bgp router-id <rid>
 no bgp ebgp-requires-policy
 no bgp enforce-first-as
 neighbor <ip> remote-as <peer-as>"
    description: "BGP base. 'no bgp ebgp-requires-policy' is REQUIRED for eBGP (FRR 10 default: session establishes but exchanges zero routes); 'no bgp enforce-first-as' is required when the peer is a route-server reflecting paths that do not start with its own AS"

  bgp_address_family:
    syntax: "router bgp <asn>
 address-family ipv4 unicast
  network <prefix>/<len>
 address-family ipv6 unicast
  neighbor <ipv6> activate
  network <ipv6-prefix>/<len>"
    description: "Per-AFI config: ipv6 neighbors need explicit 'activate'; 'network' originates a prefix that must exist in RIB (anchor with Null0 static)"

  bgp_route_server_side:
    syntax: "router bgp <asn>
 neighbor <client> remote-as <client-as>
 address-family ipv4 unicast
  neighbor <client> route-server-client
  neighbor <client> attribute-unchanged next-hop
 address-family ipv6 unicast
  neighbor <client6> activate
  neighbor <client6> route-server-client
  neighbor <client6> attribute-unchanged next-hop"
    description: "Route-server side per client: route-server-client + attribute-unchanged next-hop in BOTH AFIs keeps the origin AS-path and next-hop intact (client FIB shows 'via <origin>, from <rs>')"

  write_memory:
    syntax: "write memory"
    description: "Save integrated config to /etc/frr/frr.conf (output 'Integrated configuration saved to /etc/frr/frr.conf [OK]'); survives node restart and gns3server restart"

# Display/Diagnostic Commands
display_commands:
  terminal_length:
    syntax: "terminal length 0"
    description: "Disable paging BEFORE any show command (the pager swallows subsequent input chars; if already stuck in the pager send 'q' first)"

  show_ospf_neighbor:
    syntax: "show ip ospf neighbor"
    description: "OSPFv2 adjacencies (expect Full for every mesh peer)"

  show_ospf6_neighbor:
    syntax: "show ipv6 ospf6 neighbor"
    description: "OSPFv3 adjacencies"

  show_ip_route:
    syntax: "show ip route ospf"
    description: "OSPF-learned v4 routes (loopbacks /32, links, OE2 default on internal nodes)"

  show_ipv6_route:
    syntax: "show ipv6 route ospf6"
    description: "OSPFv3-learned v6 routes (via fe80:: link-local nexthops)"

  show_bgp_summary:
    syntax: "show bgp summary"
    description: "All BGP sessions with PfxRcd counters (PfxRcd 0 on an established eBGP session = missing 'no bgp ebgp-requires-policy')"

  show_bgp_route:
    syntax: "show bgp ipv4 unicast <prefix>"
    description: "BGP table entry for a prefix (paths, 'from' peer, best selection)"

  ping:
    syntax: "ping <destination>"
    description: "vtysh ping: NO -c count and NO source option (both give '% Unknown command'); it NEVER stops by itself — send Ctrl-C (\\x03) to interrupt. To ping with a source address use Linux ping from bash instead"

# Important Notes
notes:
  - "GNS3 FRR docker console (telnet) lands DIRECTLY in vtysh ('<hostname>#'), not bash; shell commands are rejected with '% Unknown command'"
  - "Stay in vtysh: return from config levels with 'end'; a bare 'exit' at the top drops into bash and pollutes the next session; if you fall to bash, type 'vtysh' to come back"
  - "Abbreviations work: 'ip os ne point-to-point' = 'ip ospf network point-to-point'"
  - "OSPF transit links: set 'ip ospf network point-to-point' (and 'ipv6 ospf6 network point-to-point') on mesh links to skip DR election"
  - "FRR 10.x has no OSPF instance mode: 'router ospf 1' / 'ip ospf 1 area 0' fail with 'instance not running'"
  - "runlevel: 'write memory' writes /etc/frr/frr.conf via the integrated config; container restart reloads it automatically and BGP sessions reconnect on their own"
  - "When driven via netmiko-style config tools (device_config_send), exec commands like 'write memory' inside config mode need a 'do' prefix ('do write memory')"
  - "Config pushes over WebSocket console: end each line with \\r\\n, pace ~0.3s/line; open streams with \\x03 + 'end' to clear leftovers from a previous session (a running ping survives ws disconnect)"

# Troubleshooting Guide
troubleshooting:
  ospf_instance_not_running:
    - "Error '% ... instance that is not running' or '% OSPF is not running in instance mode'"
    - "Cause: used 'router ospf 1' or 'ip ospf 1 area 0' (FRR 10.x)"
    - "Fix: 'router ospf' without pid + 'network' statements; interface-level 'ip ospf area 0'"

  ospf6_block_empty:
    - "Symptom: 'router ospf6' config stays empty, no router-id set"
    - "Cause: used 'router-id' inside router ospf6 (silently ignored)"
    - "Fix: 'ospf6 router-id <rid>'"

  bgp_established_zero_routes:
    - "Symptom: eBGP session Established but PfxRcd/PfxSent = 0"
    - "Cause: FRR 10 default 'ebgp-requires-policy'"
    - "Fix: 'no bgp ebgp-requires-policy' under router bgp"

  bgp_session_flapping_3_11:
    - "Symptom: session resets repeatedly with 3/11 notification against a route-server"
    - "Cause: 'enforce-first-as' rejects paths whose first AS is not the peer AS"
    - "Fix: 'no bgp enforce-first-as'; then 'clear bgp <peer> soft in' — routes are NOT re-advertised automatically after the change"

  show_output_swallows_commands:
    - "Symptom: commands after a show come back 'Unknown command'"
    - "Cause: pager ate the input characters"
    - "Fix: 'terminal length 0' first (at a clean prompt); send 'q' if already stuck"

  ping_never_stops:
    - "Symptom: session stuck in continuous ping output, prompt never returns"
    - "Cause: vtysh ping has no count limit and survives console disconnect"
    - "Fix: send Ctrl-C (\\x03); always open console sessions with \\x03 to clear leftover pings"

  config_lost_after_reboot:
    - "FRR docker keeps config only if 'write memory' was executed"
    - "/etc/frr is a persistent bind mount; survives container recreate and gns3server restart"

# Command aliases (for LLM understanding)
command_aliases:
  save_config: "write memory"
  save: "write memory"
  write_memory: "write memory"
  wr: "write memory"
  conf_t: "configure terminal"
  show_ip_ospf_neighbor: "show ip ospf neighbor"
  show_ipv6_ospf6_neighbor: "show ipv6 ospf6 neighbor"
  show_bgp_summary: "show bgp summary"
  show_route: "show ip route"
  ping_test: "ping <destination>"
